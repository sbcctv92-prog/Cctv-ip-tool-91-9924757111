name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer Action
      uses: ArtemSnet/buildozer-action@v1
      with:
        workdir: .
        buildozer_version: stable

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SB_INFOTECH_Android_APK
        path: |
          bin/*.apk
          .buildozer/android/platform/build-arm64-v8a/dists/sbinfotech/build/outputs/apk/debug/*.apk
